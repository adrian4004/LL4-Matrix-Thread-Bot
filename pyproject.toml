[project]
name = "ll4-matrix-thread-bot"
version = "0.1.0"
description = "Rule-based Matrix bot that opens a thread on every new root message"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
